[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycsr-business-analytics-report"
version = "1.0.5"
description = "Business-ready dataset profiling and automatic machine-learning comparison reports"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "PyCSR_ML contributors"}]
keywords = ["data-profiling", "machine-learning", "reporting", "eda", "scikit-learn"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jinja2>=3.1,<4",
  "numpy>=1.23,<3",
  "pandas>=1.5,<3",
  "plotly>=5.18,<6",
  "scikit-learn>=1.2,<2",
]

[project.optional-dependencies]
dev = ["build>=1.0", "pytest>=7.4", "ruff>=0.4"]

[project.scripts]
PyCSR_ML = "pycsr_ml.cli:main"
pycsr-ml = "pycsr_ml.cli:main"

[project.urls]
Homepage = "https://github.com/My-PyPi-Projects/PyCSR_ML"
Documentation = "https://github.com/My-PyPi-Projects/PyCSR_ML#readme"
Issues = "https://github.com/My-PyPi-Projects/PyCSR_ML/issues"
Source = "https://github.com/My-PyPi-Projects/PyCSR_ML"


[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pycsr_ml = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = ["slow: larger resilience tests that may take several seconds"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
ignore = [
  "BLE001",  # Model isolation intentionally records unexpected estimator failures.
  "ISC004",  # Parenthesized message fragments are intentionally readable.
  "RUF022",  # Public API order is semantic: primary function before version metadata.
  "UP006", "UP007", "UP035", "UP045",  # Keep Python 3.9-compatible typing syntax.
]
