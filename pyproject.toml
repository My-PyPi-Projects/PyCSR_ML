[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycsr-business-analytics-report"
version = "0.1.4"
description = "Business-ready dataset profiling and automatic machine-learning comparison reports"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "PyCSR_ML contributors"}]
keywords = ["data-profiling", "machine-learning", "reporting", "eda", "scikit-learn"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "jinja2>=3.1,<4",
  "numpy>=1.23,<3",
  "pandas>=1.5,<3",
  "plotly>=5.18,<6",
  "scikit-learn>=1.2,<2",
]

[project.optional-dependencies]
dev = ["build>=1.0", "pytest>=7.4", "ruff>=0.4"]

[project.scripts]
PyCSR_ML = "pycsr_ml.cli:main"
pycsr-ml = "pycsr_ml.cli:main"

[project.urls]
Homepage = "https://github.com/My-PyPi-Projects/PyCSR_ML"
Documentation = "https://github.com/My-PyPi-Projects/PyCSR_ML#readme"
Issues = "https://github.com/My-PyPi-Projects/PyCSR_ML/issues"
Source = "https://github.com/My-PyPi-Projects/PyCSR_ML"


[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pycsr_ml = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"
